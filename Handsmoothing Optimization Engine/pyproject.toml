[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handsmoothing-optimization-engine"
version = "0.1.0"
description = "CP-SAT optimization engine for integer norm-curve hand smoothing"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "ortools>=9.10",
]

[project.scripts]
soe = "handsmoothing_soe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

